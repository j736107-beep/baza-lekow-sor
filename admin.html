<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – baza leków SOR</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<header><h1>🔐 Panel koordynatora – baza leków SOR</h1><p>Kod dostępu grupy, zatwierdzanie, edycja, usuwanie, eksport.</p></header>
<main>
<div class="card" id="login"><label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Hasło</label><input id="pw" type="password" autocomplete="current-password"><button id="li">Zaloguj</button><div id="lmsg" style="color:#a00;margin-top:8px"></div></div>
<div id="panel" style="display:none">
<div class="card"><b>Link dla grupy WhatsApp</b><div id="ginfo"><small>…</small></div>
<label>Ważny do (czas polski)</label><input id="exp" type="datetime-local">
<button id="nc">🔄 Nowy kod (stary przestaje działać od razu)</button> <button class="sec" id="se">Zapisz datę ważności</button> <button class="red" id="off">Wyłącz dostęp</button>
<div id="newlink" style="display:none"><label>Nowy link – skopiuj i wyślij na grupę (pokazywany tylko raz):</label><input id="nl" readonly onclick="this.select()"><button class="sec" id="cp">Kopiuj link</button></div></div>
<div class="card"><button id="ej">Eksport JSON → Asystent SOR „Własne leki”</button> <button class="sec" id="ec">Eksport CSV</button> <button class="sec" id="lo">Wyloguj</button>
<div class="row"><select id="fs" style="margin-top:10px"><option value="">Wszystkie statusy</option><option>do weryfikacji</option><option>zatwierdzone</option><option>odrzucone</option></select><input id="flt" placeholder="Szukaj…" style="margin-top:10px"></div>
<small>Eksport JSON obejmuje tylko wpisy <b>zatwierdzone</b>. W Asystencie SOR: Leki → „+ Własne leki” → Import.</small><div id="cnt"></div></div>
<div id="all"></div></div>
</main>
<script src="common.js"></script>
<script>
var DATA=[],OPEN={};
function err(r){if(r.error){alert('Błąd: '+r.error.message);return true}}
// datetime-local w czasie polskim -> ISO z offsetem Europe/Warsaw
function plToISO(v){var d=new Date(v+':00Z');var off=new Date(d.toLocaleString('en-US',{timeZone:'Europe/Warsaw'}))-new Date(d.toLocaleString('en-US',{timeZone:'UTC'}));return new Date(d-off).toISOString()}
function isoToPL(s){var p=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Warsaw',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(s));return p.replace(' ','T')}
function info(){sb.rpc('sor_admin_info').then(function(r){if(err(r))return;var g=r.data;
 if(!g){$('ginfo').innerHTML='<small style="color:#a00">Brak kodu – kliknij „Nowy kod”, żeby utworzyć link dla grupy.</small>';$('exp').value='2027-11-11T23:59';return}
 var on=g.active&&new Date(g.expires_at)>new Date();$('exp').value=isoToPL(g.expires_at);
 $('ginfo').innerHTML='<small>Status: <b style="color:'+(on?'#176b25':'#a00')+'">'+(on?'aktywny':(g.active?'wygasł':'wyłączony'))+'</b> · ważny do '+fmtPL(g.expires_at)+' · kod zmieniony '+fmtPL(g.rotated_at)+'</small>'})}
function render(){var q=norm($('flt').value),s=$('fs').value;var f=DATA.filter(function(r){return(!s||r.status===s)&&(!q||norm(JSON.stringify(r)).indexOf(q)>=0)});
 $('cnt').textContent='Wpisy: '+f.length+' / '+DATA.length+' · do weryfikacji: '+DATA.filter(function(r){return r.status==='do weryfikacji'}).length;
 $('all').innerHTML=f.map(function(r){return card2(r,OPEN[r.id],'<br><button data-a="ok" data-id="'+r.id+'">✓ Zatwierdź</button><button class="sec" data-a="no" data-id="'+r.id+'">Odrzuć</button><button class="sec" data-a="ed" data-id="'+r.id+'">Edytuj</button><button class="red" data-a="del" data-id="'+r.id+'">Usuń</button>')}).join('')}
function load(){sb.from('leki').select('*').order('created_at',{ascending:false}).then(function(r){if(err(r))return;DATA=r.data||[];render()})}
function upd(id,ch){sb.from('leki').update(ch).eq('id',id).then(function(r){err(r);load()})}
$('all').onclick=function(ev){var b=ev.target.closest('button');if(!b){var d=ev.target.closest('.ex');if(d&&!ev.target.closest('a')){OPEN[d.dataset.id]=!OPEN[d.dataset.id];render()}return}var id=b.dataset.id,r=DATA.find(function(x){return x.id===id});
 if(b.dataset.a==='ok')upd(id,{status:'zatwierdzone'});if(b.dataset.a==='no')upd(id,{status:'odrzucone'});
 if(b.dataset.a==='del'&&confirm('Usunąć wpis '+r.substancja+'?'))sb.from('leki').delete().eq('id',id).then(function(x){err(x);load()});
 if(b.dataset.a==='ed'){var ch={};['substancja','link','tekst_mp'].forEach(function(k){var v=prompt(k,r[k]||'');if(v!==null&&v!==r[k])ch[k]=v});if(Object.keys(ch).length)upd(id,ch)}};
$('nc').onclick=function(){if(!confirm('Wygenerować nowy kod? Dotychczasowy link przestanie działać natychmiast dla wszystkich.'))return;var c=newCode();
 sb.rpc('sor_admin_set_code',{p_new_code:c,p_expires:plToISO($('exp').value||'2027-11-11T23:59')}).then(function(r){if(err(r))return;$('nl').value=APP_URL+'#k='+c;$('newlink').style.display='';info()})};
$('cp').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText($('nl').value);$('cp').textContent='Skopiowano ✓'};
$('se').onclick=function(){sb.rpc('sor_admin_set_expiry',{p_expires:plToISO($('exp').value),p_active:true}).then(function(r){if(!err(r))info()})};
$('off').onclick=function(){if(confirm('Wyłączyć dostęp dla grupy?'))sb.rpc('sor_admin_set_expiry',{p_expires:plToISO($('exp').value),p_active:false}).then(function(r){if(!err(r))info()})};
$('fs').onchange=render;$('flt').oninput=render;
$('ej').onclick=function(){exportJSON(DATA.filter(function(r){return r.status==='zatwierdzone'}))};$('ec').onclick=function(){exportCSV(DATA)};
function show(ok){$('login').style.display=ok?'none':'';$('panel').style.display=ok?'':'none';if(ok){info();load();setInterval(load,15000)}}
$('li').onclick=function(){sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value}).then(function(r){if(r.error)return $('lmsg').textContent='Błąd logowania: '+r.error.message;
 sb.rpc('sor_admin_info').then(function(x){if(x.error&&/BRAK_UPRAWNIEN/.test(x.error.message)){sb.auth.signOut();return $('lmsg').textContent='To konto nie jest kontem koordynatora.'}show(true)})})};
$('lo').onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)show(true)});
</script></body></html>
